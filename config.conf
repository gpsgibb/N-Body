[setup]
# Number of spatial dimensions
ndim = 3

[forces]
# force is GM / (r**2 + a**2) where a is the smoothing size
smoothing_size = 1E-3
# Ratio of node size to distance to node above which the node must be "opened" to evaluate forces
multipole_acceptance_criterion = 0.5

[integrator]
timestep = 1E-3
# Ratio of timestep to typical interaction  timescale (smaller = more accurate)
eta = 0.02
# Maximum depth of adaptive timestep integrators... minimum timestep = dt/2**maxdepth
maxdepth = 10

[iterator]
maxits = 10
